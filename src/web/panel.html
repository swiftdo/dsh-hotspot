<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-hotspot 管理</title>
<style>
  :root {
    --bg: #15161a;
    --panel: #1c1d23;
    --panel-2: #22232a;
    --line: #2e3038;
    --text: #e8e8ea;
    --muted: #9b9ca6;
    --accent: #4db6a0;
    --warn: #e0a34a;
    --danger: #d9636b;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.6 system-ui, -apple-system, "PingFang SC", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  header h1 { font-size: 14px; font-weight: 500; margin: 0; }
  header .path { color: var(--muted); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0d1a17; border-color: transparent; font-weight: 500; }
  button.ghost { background: transparent; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; }
  nav button { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom-color: transparent; }
  nav button.on { background: var(--panel); border-color: var(--line); border-bottom-color: var(--panel); }
  main { padding: 16px 20px 48px; max-width: 1080px; }
  section { display: none; }
  section.on { display: block; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 400; font-size: 12px; }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0;
  }
  textarea { width: 100%; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .item { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .item:last-child { border-bottom: 0; }
  .item .title { font-weight: 500; }
  .item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .score { font-variant-numeric: tabular-nums; color: var(--accent); }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 10px; }
  .stat b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 11px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.ok { color: var(--accent); border-color: rgba(77, 182, 160, .45); background: rgba(77, 182, 160, .1); }
  .badge.warn { color: var(--warn); border-color: rgba(224, 163, 74, .45); background: rgba(224, 163, 74, .1); }
  .rss-card { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .rss-url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--accent); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-btn { color: var(--muted); font-size: 12px; text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
  .link-btn:hover { color: var(--accent); border-color: var(--accent); }
  .rank { color: var(--muted); font-size: 12px; min-width: 26px; font-variant-numeric: tabular-nums; }
  .feed-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 26px 0 4px; padding-top: 16px; border-top: 1px solid var(--line); }
  .feed-head strong { font-weight: 500; }
  .feed-head .count { color: var(--accent); }
  .feed-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .feed-row:last-child { border-bottom: 0; }
  .feed-row .title a { color: var(--text); text-decoration: none; }
  .feed-row .title a:hover { color: var(--accent); }
  .feed-row .summary { color: var(--muted); font-size: 12px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  header .spacer { flex: 1; }
  header { flex-wrap: wrap; }
  .tag { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-right: 4px; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--panel-2); padding: 10px; border-radius: 6px; font-size: 12px; max-height: 260px; overflow: auto; }
  .toast {
    position: fixed; right: 20px; bottom: 20px; max-width: 420px;
    background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 6px; padding: 10px 14px; display: none;
  }
  .toast.err { border-left-color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>dsh-hotspot</h1>
  <span class="path" id="projectPath"></span>
  <span class="spacer"></span>
  <button class="ghost" id="rssTop" title="复制 RSS 订阅地址">RSS 订阅</button>
  <button class="ghost" id="reload">刷新</button>
  <button class="ghost" id="deploy" style="display:none">部署站点</button>
  <button class="primary" id="run">立即抓取</button>
</header>

<nav>
  <button data-tab="sources" class="on">源</button>
  <button data-tab="items">候选</button>
  <button data-tab="content">内容</button>
  <button data-tab="config">设置</button>
</nav>

<main>
  <section id="sources" class="on">
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <strong style="font-weight:500">新增源</strong>
        <span class="muted">kind 决定要填哪些字段</span>
      </div>
      <div class="grid">
        <input id="newId" placeholder="id（小写-连字符）">
        <select id="newKind">
          <option value="rss">rss</option>
          <option value="github-release">github-release</option>
          <option value="hn">hn</option>
        </select>
        <input id="newTarget" placeholder="url 或 owner/repo">
        <input id="newPoints" type="number" placeholder="minPoints（仅 hn）" value="100">
      </div>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="addSource">添加</button>
        <span class="muted" id="sourceHint"></span>
      </div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:8px"><span class="muted" id="sourcesMode"></span></div>
      <table>
        <thead><tr><th style="width:150px">id</th><th style="width:130px">kind</th><th>目标</th><th style="width:70px"></th></tr></thead>
        <tbody id="sourceRows"></tbody>
      </table>
    </div>
  </section>

  <section id="items">
    <div class="card" id="digestMeta"></div>
    <div class="card" id="itemList"></div>
  </section>

  <section id="content">
    <div class="card">
      <strong style="font-weight:500">草稿（docs/draft）</strong>
      <div class="writer-bar">
        <label>写作方式
          <select id="writerMode">
            <option value="agent">联网搜索（子代理）</option>
            <option value="direct">只用手头证据（选中模型）</option>
          </select>
        </label>
        <label>模型
          <select id="writerModel"><option value="">（未接入模型目录）</option></select>
        </label>
      </div>
      <div id="draftList" class="muted" style="margin-top:8px">—</div>
    </div>
    <div class="card">
      <strong style="font-weight:500">已发布（docs/article）</strong>
      <div id="articleList" class="muted" style="margin-top:8px">—</div>
    </div>
  </section>

  <section id="config">
    <div class="card">
      <div class="grid">
        <label>候选上限<input id="cfgLimit" type="number"></label>
        <label>时间窗（小时）<input id="cfgSince" type="number"></label>
        <label>半衰期（小时）<input id="cfgHalf" type="number"></label>
        <label>去重阈值<input id="cfgThreshold" type="number" step="0.05" min="0.3" max="0.95"></label>
      </div>
      <div class="row" style="margin-top:12px">
        <input id="cfgHosts" placeholder="外链白名单域名，逗号分隔" style="flex:1">
      </div>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="saveConfig">保存设置</button>
        <span class="muted" id="configHint"></span>
      </div>
    </div>
    <div class="card">
      <div class="row">
        <strong style="font-weight:500">站点部署</strong>
        <span class="muted" id="deployHint"></span>
      </div>
      <div class="muted" style="margin-top:6px">绑定后页头才出现「部署站点」按钮；留空保存即解绑。</div>
      <textarea id="cfgDeploy" rows="3" style="margin-top:8px" placeholder="npm run build && ./deploy.sh --no-git --skip-build"></textarea>
      <div class="muted" style="margin-top:6px">在博客项目根目录下由 /bin/sh -c 执行，单次最长 10 分钟，输出保留末尾 64KB。</div>
      <div class="row" style="margin-top:10px">
        <button id="deployNow" disabled>立即部署</button>
      </div>
      <pre id="deployOut" style="display:none"></pre>
    </div>
    <div class="card">
      <strong style="font-weight:500">选题画像</strong>
      <div class="muted" style="margin-top:6px">受控 tag 词表</div>
      <div id="tagCloud" style="margin-top:6px"></div>
      <div class="muted" style="margin-top:10px">关键词</div>
      <div id="keywordCloud" style="margin-top:6px"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const API = '/dsh-hotspot/api';
let state = null;
let sources = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(message, isError) {
  const el = $('toast');
  el.textContent = message;
  el.className = 'toast' + (isError ? ' err' : '');
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 4200);
}

async function api(path, options) {
  const response = await fetch(API + path, {
    headers: { 'content-type': 'application/json' },
    ...options,
  });
  const payload = await response.json();
  if (!response.ok || payload.ok === false) throw new Error(payload.message || ('HTTP ' + response.status));
  return payload.value;
}

function sourceTarget(source) {
  if (source.kind === 'github-release') return source.repo || '';
  if (source.kind === 'hn') return 'points > ' + (source.minPoints ?? 100);
  return source.url || '';
}

// 与扫描同一套判定：配置里有源就抓配置里的，一个都没有就用内置默认源。
function builtinMode() {
  if (state?.sourcesMode) return state.sourcesMode === 'builtin';
  return !(Array.isArray(state?.config?.sources) && state.config.sources.length > 0);
}

function renderSources() {
  const builtinIds = new Set((state?.builtinSources || []).map((source) => source.id));
  const rows = sources.map((source, index) => {
    const builtin = builtinIds.has(source.id) ? ' <span class="tag">内置</span>' : '';
    const action = builtinMode()
      ? '<span class="muted" style="font-size:11px">默认生效</span>'
      : '<button class="ghost danger" data-del="' + index + '">删除</button>';
    return '<tr>' +
      '<td><code>' + esc(source.id) + '</code>' + builtin + '</td>' +
      '<td>' + esc(source.kind) + '</td>' +
      '<td class="muted" style="word-break:break-all">' + esc(sourceTarget(source)) + '</td>' +
      '<td>' + action + '</td>' +
      '</tr>';
  }).join('');
  $('sourceRows').innerHTML = rows || '<tr><td colspan="4" class="muted">还没有源，先添加一个</td></tr>';
  // 内置默认源正在生效时，删掉它也会立刻回落到默认源，所以不给删除按钮。
  if (!builtinMode()) {
    $('sourceRows').querySelectorAll('[data-del]').forEach((button) => {
      button.onclick = async () => {
        sources.splice(Number(button.dataset.del), 1);
        await saveSources();
      };
    });
  }
  $('sourcesMode').textContent = builtinMode()
    ? '配置里没有自定义源，扫描直接使用内置默认源；添加任意自定义源后以配置为准'
    : '聚合扫描时会并发采集下面所有源';
}

async function saveSources() {
  try {
    const value = await api('/sources', { method: 'POST', body: JSON.stringify({ sources }) });
    sources = value.sources;
    renderSources();
    toast('已保存 ' + sources.length + ' 个源');
  } catch (error) {
    toast(error.message, true);
    await load();
  }
}

function rssUrl() {
  return location.origin + (state?.feed?.rssPath || '/dsh-hotspot/rss.xml');
}

function sourceLabelOf(id) {
  if (!id) return '';
  const all = [...(state?.activeSources || state?.config?.sources || []), ...(state?.builtinSources || [])];
  const hit = all.find((source) => source.id === id);
  return hit?.name || id;
}

function fmtTime(value) {
  const when = value ? new Date(value) : null;
  if (!when || Number.isNaN(when.getTime())) return '';
  return when.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

async function copyText(text, message) {
  try {
    await navigator.clipboard.writeText(text);
    toast(message);
    return;
  } catch {
    // 非安全上下文里 clipboard API 不可用，退回选中复制
  }
  const holder = document.createElement('textarea');
  holder.value = text;
  holder.style.position = 'fixed';
  holder.style.opacity = '0';
  document.body.appendChild(holder);
  holder.select();
  try {
    document.execCommand('copy');
    toast(message);
  } catch {
    toast('复制失败，请手动选择地址：' + text, true);
  }
  holder.remove();
}

let feedExpanded = false;
const FEED_PREVIEW = 24;

function renderItems() {
  const digest = state.digest;
  const rss = rssUrl();

  if (!digest) {
    $('digestMeta').innerHTML =
      '<div class="row"><strong style="font-weight:500">今天还没有抓取记录</strong>' +
      '<span class="muted">点右上角「立即抓取」跑一次，候选与订阅源会同时有内容。</span></div>';
    $('itemList').innerHTML = '<span class="muted">暂无候选</span>';
    return;
  }

  const status = digest.status || {};
  const health = status.degraded
    ? '<span class="badge warn">严重降级</span>'
    : (status.feedsOk === status.feedsTotal
      ? '<span class="badge ok">抓取正常</span>'
      : '<span class="badge warn">部分降级</span>');
  const stat = (value, label) => '<div class="stat"><b>' + esc(value) + '</b><span>' + esc(label) + '</span></div>';

  $('digestMeta').innerHTML =
    '<div class="row" style="justify-content:space-between">' +
      '<div class="row"><strong style="font-weight:500;font-size:15px">' + esc(digest.date) + '</strong>' + health + '</div>' +
      '<span class="muted">生成于 ' + esc(fmtTime(digest.generatedAt) || '—') + '</span>' +
    '</div>' +
    '<div class="stats">' +
      stat((status.feedsOk ?? 0) + '/' + (status.feedsTotal ?? 0), '成功源') +
      stat(status.itemsRaw ?? 0, '抓取原文') +
      stat(status.itemsDeduped ?? 0, '去重后') +
      stat(status.candidates ?? digest.items.length, '候选') +
      stat(state.feed?.items?.length ?? 0, '今日文章') +
    '</div>' +
    (status.failedSources?.length
      ? '<div class="muted" style="margin-top:8px">失败源：' + esc(status.failedSources.join('、')) + '</div>'
      : '') +
    '<div class="rss-card">' +
      '<span class="badge ok">RSS</span>' +
      '<code class="rss-url" title="' + esc(rss) + '">' + esc(rss) + '</code>' +
      '<button class="ghost" data-copy-rss>复制订阅地址</button>' +
      '<a class="link-btn" href="' + esc(rss) + '" target="_blank" rel="noreferrer">打开订阅源</a>' +
    '</div>' +
    '<div class="muted" style="margin-top:8px;font-size:11px">阅读器里候选 ' + (digest.items.length) +
      ' 条排最前（用当天生成时间），其后是今天抓到的其余文章，单次最多 80 条。</div>';

  $('digestMeta').querySelector('[data-copy-rss]').onclick = () => copyText(rss, 'RSS 订阅地址已复制');

  const itemsHtml = digest.items.map((item, index) => {
    const tags = (item.tags || []).map((t) => '<span class="tag">' + esc(t) + '</span>').join('');
    const sources = (item.sources || []).map((src) =>
      '<div class="meta">· ' + esc(src.source) + ' — <a href="' + esc(src.url) + '" target="_blank" rel="noreferrer" style="color:var(--muted)">' + esc(src.title).slice(0, 90) + '</a></div>'
    ).join('');
    return '<div class="item">' +
      '<div class="row"><span class="rank">#' + (index + 1) + '</span>' +
      '<span class="score">' + (Number(item.score) || 0).toFixed(1) + '</span>' +
      '<span class="title" style="flex:1">' + esc(item.title) + '</span>' +
      '<a class="link-btn" href="' + esc(item.url) + '" target="_blank" rel="noreferrer">原文</a>' +
      '<button class="ghost" data-scaffold="' + esc(item.id) + '">生成草稿</button></div>' +
      '<div class="meta">' + tags + '来源：' + esc([...new Set((item.sources || []).map((src) => sourceLabelOf(src.source)))].join('、') || '未知') +
        (item.sourceCount > 1 ? ' · ' + item.sourceCount + ' 源共现' : '') + '</div>' +
      '<details><summary>查看来源与摘要</summary>' + sources +
      '<pre>' + esc(item.summary || '（无摘要）') + '</pre></details>' +
      '</div>';
  }).join('') || '<span class="muted">今天没有候选</span>';

  const feedItems = (state.feed?.items || []).filter((item) => !item.candidate);
  let feedHtml = '';
  if (feedItems.length) {
    const shown = feedExpanded ? feedItems : feedItems.slice(0, FEED_PREVIEW);
    const rows = shown.map((item) => {
      const when = fmtTime(item.publishedAt);
      const summary = String(item.summary || '').trim();
      return '<div class="feed-row">' +
        '<div class="title"><a href="' + esc(item.url) + '" target="_blank" rel="noreferrer">' + esc(item.title || item.url) + '</a></div>' +
        '<div class="meta">' + ((item.sourceName || item.source) ? '<span class="tag">' + esc(item.sourceName || item.source) + '</span>' : '') +
        esc(when) + (summary ? (when ? ' · ' : '') + esc(summary) : '') + '</div>' +
        '</div>';
    }).join('');
    const missingMeta = feedItems.filter((item) => !item.source && !item.publishedAt).length;
    const toggle = feedItems.length > FEED_PREVIEW
      ? '<button class="ghost" data-toggle-feed>' + (feedExpanded ? '收起' : '展开全部 ' + feedItems.length + ' 条') + '</button>'
      : '';
    feedHtml =
      '<div class="feed-head">' +
        '<strong>今日订阅文章 <span class="count">' + feedItems.length + '</span></strong>' +
        '<span class="muted">' + esc(state.feed?.date || '') + ' · 候选 ' + (digest.items.length) + ' 条已排在上方</span>' +
        '<span style="flex:1"></span>' + toggle +
      '</div>' +
      (missingMeta
        ? '<div class="muted" style="font-size:11px;margin-top:4px">其中 ' + missingMeta + ' 条是旧格式原文（没有源与时间），重新抓取一次即可补全。</div>'
        : '') +
      rows;
  }

  $('itemList').innerHTML = itemsHtml + feedHtml;

  const toggleButton = $('itemList').querySelector('[data-toggle-feed]');
  if (toggleButton) {
    toggleButton.onclick = () => {
      feedExpanded = !feedExpanded;
      renderItems();
    };
  }

  $('itemList').querySelectorAll('[data-scaffold]').forEach((button) => {
    button.onclick = async () => {
      button.disabled = true;
      try {
        const value = await api('/scaffold', { method: 'POST', body: JSON.stringify({ id: button.dataset.scaffold }) });
        toast('草稿已生成：' + value.file);
        await load();
      } catch (error) {
        toast(error.message, true);
      } finally {
        button.disabled = false;
      }
    };
  });
}

let writerCatalog = { providers: [], selection: { provider: '', model: '', mode: 'agent' } };

function modelKey(provider, model) { return provider + '\u0000' + model; }

function renderWriterBar() {
  const modeSelect = $('writerMode');
  const modelSelect = $('writerModel');
  modeSelect.value = writerCatalog.selection.mode === 'direct' ? 'direct' : 'agent';

  const options = [];
  for (const provider of writerCatalog.providers) {
    for (const model of provider.models) {
      const selected = provider.provider === writerCatalog.selection.provider && model.id === writerCatalog.selection.model;
      options.push('<option value="' + esc(modelKey(provider.provider, model.id)) + '"' + (selected ? ' selected' : '') + '>' +
        esc(provider.label + ' / ' + model.name) + '</option>');
    }
  }
  modelSelect.innerHTML = options.length ? options.join('') : '<option value="">（未接入模型目录）</option>';
  modelSelect.disabled = options.length === 0;
}

async function loadWriterCatalog() {
  try {
    const value = await api('/models');
    writerCatalog = {
      providers: value.providers || [],
      selection: value.selection || { provider: '', model: '', mode: 'agent' },
    };
  } catch {
    writerCatalog = { providers: [], selection: { provider: '', model: '', mode: 'agent' } };
  }
  renderWriterBar();
}

async function saveWriterSelection() {
  const [provider, model] = ($('writerModel').value || '').split('\u0000');
  const mode = $('writerMode').value === 'direct' ? 'direct' : 'agent';
  try {
    const value = await api('/models', {
      method: 'POST',
      body: JSON.stringify({ provider: provider || '', model: model || '', mode }),
    });
    writerCatalog.selection = { provider: value.provider, model: value.model, mode: value.mode || mode };
    toast(mode === 'direct' ? '写作方式：只用手头证据' : '写作方式：联网搜索');
  } catch (error) {
    toast(error.message, true);
  }
}

function renderContent() {
  $('draftList').innerHTML = state.drafts.length
    ? state.drafts.map((d) => '<div class="item"><div class="row">' +
      '<div class="title" style="flex:1">' + esc(d.title) + '</div>' +
      '<button class="ghost" data-generate="' + esc(d.slug || '') + '">AI 写正文</button></div>' +
      '<div class="meta">' + esc(d.file) + ' · ' + esc(d.date) + '</div></div>').join('')
    : '没有草稿';

  // 正文由宿主的子代理写（联网查证 → 落盘 JSON → 宿主登记补料并写正文 → 跑闸门）。
  // 一次几秒到几分钟，按钮期间保持禁用，避免重复起代理。
  $('draftList').querySelectorAll('[data-generate]').forEach((button) => {
    button.onclick = async () => {
      const slug = button.dataset.generate;
      if (!slug) return toast('这条草稿没有可用的 slug，无法定位候选', true);
      const label = button.textContent;
      button.disabled = true;
      button.textContent = '写作中…';
      try {
        const mode = $('writerMode').value === 'direct' ? 'direct' : 'agent';
        const [provider, model] = ($('writerModel').value || '').split('\u0000');
        const value = await api('/generate', {
          method: 'POST',
          body: JSON.stringify({ slug, mode, provider: provider || '', model: model || '' }),
        });
        const violations = value.checks && value.checks.ok === false ? value.checks.violations : [];
        toast(violations.length
          ? '正文已写入，但没过闸门：' + violations[0].message
          : '正文已写入：' + value.bodyChars + ' 字 · 补料 ' + value.registered + ' 条' +
            (value.model ? ' · ' + value.model : ''));
        await load();
      } catch (error) {
        toast(error.message, true);
      } finally {
        button.disabled = false;
        button.textContent = label;
      }
    };
  });

  $('articleList').innerHTML = state.articles.length
    ? state.articles.map((a) => '<div class="item"><div class="title">' + esc(a.title) + '</div><div class="meta"><a href="/' + 'article/' + esc(a.slug) + '/" target="_blank" style="color:var(--muted)">/article/' + esc(a.slug) + '/</a>' +
      (a.tags.length ? ' · ' + a.tags.map(esc).join(' / ') : '') + '</div></div>').join('')
    : '还没有文章';
}

function renderConfig() {
  const rank = state.config.rank || {};
  $('cfgLimit').value = rank.limit ?? 15;
  $('cfgSince').value = rank.sinceHours ?? 36;
  $('cfgHalf').value = rank.halfLifeHours ?? 24;
  $('cfgThreshold').value = rank.clusterThreshold ?? 0.6;
  $('cfgHosts').value = (state.config.publish?.allowedHosts || []).join(', ');
  const deployConfigured = Boolean(state.config.deploy?.configured);
  $('cfgDeploy').value = state.config.deploy?.script || '';
  $('deploy').style.display = deployConfigured ? '' : 'none';
  $('deployNow').disabled = !deployConfigured;
  $('deployHint').textContent = deployConfigured
    ? '已绑定：' + state.config.deploy.script
    : '未绑定，页头不显示部署按钮';

  $('tagCloud').innerHTML = state.profile.tags.map((t) => '<span class="tag">' + esc(t) + '</span>').join('') || '<span class="muted">—</span>';
  $('keywordCloud').innerHTML = state.profile.keywords.map((t) => '<span class="tag">' + esc(t) + '</span>').join('') || '<span class="muted">—</span>';
}

async function load() {
  try {
    state = await api('/state');
    sources = (state.activeSources || state.config.sources || []).slice();
    $('projectPath').textContent = state.projectRoot;
    renderSources();
    renderItems();
    renderContent();
    renderConfig();
  } catch (error) {
    toast('加载失败：' + error.message, true);
  }
  await loadWriterCatalog();
}

document.querySelectorAll('nav button').forEach((button) => {
  button.onclick = () => {
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b === button));
    document.querySelectorAll('section').forEach((s) => s.classList.toggle('on', s.id === button.dataset.tab));
  };
});

$('rssTop').onclick = () => copyText(rssUrl(), 'RSS 订阅地址已复制，粘到阅读器里即可订阅');
$('reload').onclick = load;
$('writerMode').onchange = saveWriterSelection;
$('writerModel').onchange = saveWriterSelection;

$('run').onclick = async () => {
  const button = $('run');
  button.disabled = true;
  button.textContent = '抓取中…';
  try {
    const value = await api('/run', { method: 'POST', body: '{}' });
    toast('抓取完成：' + value.status.feedsOk + '/' + value.status.feedsTotal + ' 源，候选 ' + value.status.candidates + ' 条');
    await load();
    document.querySelector('nav button[data-tab="items"]').click();
  } catch (error) {
    toast('抓取失败：' + error.message, true);
  } finally {
    button.disabled = false;
    button.textContent = '立即抓取';
  }
};

$('addSource').onclick = async () => {
  const kind = $('newKind').value;
  const source = { id: $('newId').value.trim(), kind };
  if (kind === 'github-release') source.repo = $('newTarget').value.trim();
  else if (kind === 'hn') source.minPoints = Number($('newPoints').value) || 100;
  else source.url = $('newTarget').value.trim();

  if (!source.id) return toast('先填 id', true);
  sources.push(source);
  await saveSources();
  $('newId').value = '';
  $('newTarget').value = '';
};

function renderDeployResult(value) {
  const out = $('deployOut');
  const seconds = (Number(value.durationMs || 0) / 1000).toFixed(1);
  out.style.display = '';
  out.textContent = [
    (value.success ? '✅ 部署成功' : '❌ 部署失败') + ' · 退出码 ' + (value.code ?? '无') +
      (value.timedOut ? ' · 已超时' : '') + ' · ' + seconds + 's',
    '$ ' + value.script,
    'cwd: ' + value.cwd,
    value.stdout?.trim() ? value.stdout : '(stdout 空)',
    value.stderr?.trim() ? '[stderr]\n' + value.stderr : '',
  ].filter(Boolean).join('\n\n');
}

async function handleDeploy(button) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = '部署中…';
  try {
    const value = await api('/deploy', { method: 'POST', body: '{}' });
    renderDeployResult(value);
    toast(value.success ? '站点部署完成（' + (Number(value.durationMs || 0) / 1000).toFixed(1) + 's）' : '部署失败：' + (value.code ?? '未知退出码'), !value.success);
  } catch (error) {
    toast('部署失败：' + error.message, true);
  } finally {
    button.disabled = !(state?.config?.deploy?.configured);
    button.textContent = label;
  }
}

$('deploy').onclick = () => handleDeploy($('deploy'));
$('deployNow').onclick = () => handleDeploy($('deployNow'));

$('saveConfig').onclick = async () => {
  try {
    await api('/config', {
      method: 'POST',
      body: JSON.stringify({
        rank: {
          limit: Number($('cfgLimit').value),
          sinceHours: Number($('cfgSince').value),
          halfLifeHours: Number($('cfgHalf').value),
          clusterThreshold: Number($('cfgThreshold').value),
        },
        publish: {
          allowedHosts: $('cfgHosts').value.split(',').map((s) => s.trim()).filter(Boolean),
        },
        deploy: {
          script: $('cfgDeploy').value.trim(),
        },
      }),
    });
    toast('设置已保存');
    await load();
  } catch (error) {
    toast(error.message, true);
  }
};

load();
</script>
</body>
</html>
